<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="400" viewBox="0 0 1100 400" role="img" aria-label="Steps to load the Chrome extension from a folder">
<rect width="1100" height="400" rx="24" fill="#f6f8fc"/>
<text x="35" y="55" font-family="sans-serif" font-size="30" font-weight="bold" fill="#172033">Chrome / Edge</text>
<g font-family="sans-serif" font-size="21" fill="#172033">
<rect x="35" y="90" width="245" height="230" rx="18" fill="white" stroke="#c5d1e7"/><circle cx="75" cy="130" r="23" fill="#2575e6"/><text x="69" y="138" fill="white">1</text><text x="55" y="185">Open extensions:</text><text x="55" y="222" font-family="monospace" font-size="18">chrome://extensions</text>
<rect x="295" y="90" width="245" height="230" rx="18" fill="white" stroke="#c5d1e7"/><circle cx="335" cy="130" r="23" fill="#2575e6"/><text x="329" y="138" fill="white">2</text><text x="315" y="185">Developer mode</text><text x="315" y="217">On</text><rect x="315" y="247" width="67" height="28" rx="14" fill="#2575e6"/><circle cx="367" cy="261" r="11" fill="white"/>
<rect x="555" y="90" width="245" height="230" rx="18" fill="white" stroke="#c5d1e7"/><circle cx="595" cy="130" r="23" fill="#2575e6"/><text x="589" y="138" fill="white">3</text><text x="575" y="185">Load unpacked</text><text x="575" y="217">extension</text><rect x="575" y="247" width="195" height="38" rx="8" fill="#e9f1ff" stroke="#2575e6"/><text x="585" y="273" font-size="16">Load unpacked</text>
<rect x="815" y="90" width="250" height="230" rx="18" fill="white" stroke="#c5d1e7"/><circle cx="855" cy="130" r="23" fill="#2575e6"/><text x="849" y="138" fill="white">4</text><text x="835" y="185">Select folder:</text><text x="835" y="221" font-size="16">Documents/</text><text x="835" y="247" font-size="16">Linux Download Manager</text><text x="835" y="273" font-size="16">Extension</text>
</g><text x="35" y="370" font-family="sans-serif" font-size="20" fill="#4b5870">Refresh the video tab after loading. Chrome does not need a ZIP.</text></svg>
