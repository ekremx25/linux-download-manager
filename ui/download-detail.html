<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Download details</title><link rel="stylesheet" href="styles.css"></head><body class="dialog-page"><main class="dialog-card"><header class="dialog-header"><div class="brand"><span class="brand-mark">⇩</span><h1 id="detail-title">Download details</h1></div><button id="close" class="icon-button" aria-label="Close">×</button></header><section class="dialog-body"><p class="dialog-hint">Speed and time left refer to the current transfer. Video and audio may download separately.</p><div class="tabs" role="tablist"><button class="tab active" data-tab="info" role="tab" aria-selected="true">ⓘ Progress</button><button class="tab" data-tab="settings" role="tab" aria-selected="false">⚙ File information</button></div><div id="detail-notice" class="notice" hidden role="status"></div><section id="info-view"><dl class="detail-summary"><dt>Name</dt><dd id="d-name">—</dd><dt>Status</dt><dd id="d-status">—</dd><dt>Size</dt><dd id="d-size">—</dd><dt>Downloaded</dt><dd id="d-downloaded">—</dd><dt>Speed</dt><dd id="d-speed">—</dd><dt>Time left</dt><dd id="d-eta">—</dd><dt>Resume support</dt><dd id="d-resume">—</dd></dl><div class="progress hero-progress"><i id="detail-progress"></i></div><div class="detail-controls"><strong id="progress-label">0%</strong><div><button id="pause-resume" class="button">Pause</button><button id="cancel-download" class="button danger">Cancel download</button></div></div><div id="segment-strip" class="segment-strip" aria-label="Segment status"></div><div class="download-table"><table class="segment-table"><thead><tr><th>#</th><th>Status</th><th>Downloaded</th><th>Total</th></tr></thead><tbody id="segment-rows"></tbody></table></div></section><section id="settings-view" class="settings-view" hidden><label class="field-label">Source URL</label><div id="d-url" class="setting-readonly">—</div><label class="field-label">Save path</label><div id="d-path" class="setting-readonly">—</div><label class="field-label">Scheduled time</label><div id="d-schedule" class="setting-readonly">Not scheduled</div><label class="field-label">Speed limit</label><div id="d-bandwidth" class="setting-readonly">Unlimited</div><label class="field-label">Checksum</label><div id="d-checksum" class="setting-readonly">Not configured</div></section></section><footer class="dialog-actions"><button id="close-bottom" class="button quiet">Close</button></footer></main><script type="module" src="download-detail.js"></script></body></html>
