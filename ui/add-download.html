<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add download</title><link rel="stylesheet" href="styles.css"></head><body class="dialog-page"><main class="dialog-card"><header class="dialog-header"><div class="brand"><span class="brand-mark">⇩</span><h1>Add download</h1></div><button id="close" class="icon-button" aria-label="Close">×</button></header><section class="dialog-body"><p class="dialog-hint">Paste a link and start downloading. You can change the folder and file name.</p><div id="add-notice" class="notice" hidden role="status"></div><div class="field"><label for="url">Video or file URL</label><div class="input-action"><input id="url" type="url" placeholder="https://example.com/file.zip" autofocus><button id="paste" class="button" title="Paste from clipboard">Paste</button></div></div><div class="field"><label for="save-dir">Save folder</label><div class="input-action"><input id="save-dir" type="text" placeholder="Default download folder"><button id="choose-dir" class="button">Choose</button></div></div><div class="field"><label for="file-name">File name</label><input id="file-name" type="text" placeholder="Detected after checking the link"></div><dl id="metadata" class="metadata-summary" hidden><dt>Size</dt><dd id="meta-size">—</dd><dt>Type</dt><dd id="meta-type">—</dd><dt>Resume support</dt><dd id="meta-resume">—</dd></dl><details class="advanced"><summary>Advanced options</summary><div class="advanced-grid"><div class="field"><label for="checksum">SHA-256 checksum</label><input id="checksum" type="text" placeholder="Optional"></div><div class="field"><label for="bandwidth">Speed limit (KB/s)</label><input id="bandwidth" type="number" min="0" placeholder="Unlimited"></div><div class="field"><label for="schedule">Scheduled time</label><input id="schedule" type="datetime-local"></div></div></details><div class="field"><label><input id="enqueue-only" type="checkbox"> Add to queue only (start manually)</label></div></section><footer class="dialog-actions"><button id="cancel" class="button quiet">Cancel</button><button id="inspect" class="button">Check link</button><button id="download" class="button primary" disabled>Start download</button></footer></main><script type="module" src="add-download.js"></script></body></html>
