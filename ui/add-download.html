<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add download</title><link rel="stylesheet" href="styles.css"></head><body class="dialog-page"><main class="dialog-card"><header class="dialog-header"><div class="brand"><span class="brand-mark">⇩</span><h1>Add download</h1></div><button id="close" class="icon-button" aria-label="Close">×</button></header><section class="dialog-body"><p class="dialog-hint">Paste one URL per line. Each link is added separately; failed links stay here for retry.</p><div id="add-notice" class="notice" hidden role="status"></div><div class="field"><label for="url">Video or file URLs</label><div class="input-action"><textarea id="url" rows="3" placeholder="https://example.com/file.zip&#10;https://example.com/another.zip" autofocus></textarea><button id="paste" class="button" title="Paste from clipboard">Paste</button></div></div><div class="field"><label><input id="as-video" type="checkbox"> Download video / audio from page (yt-dlp)</label></div>
<div class="advanced-grid"><label class="field">Connections per file<select id="connections"><option value="">Use saved preference</option><option value="0">Automatic (2–4)</option><option value="1">1 connection</option><option value="2">2 connections</option><option value="3">3 connections</option><option value="4">4 connections</option><option value="5">5 connections</option><option value="6">6 connections</option><option value="7">7 connections</option><option value="8">8 connections</option><option value="9">9 connections</option><option value="10">10 connections</option><option value="11">11 connections</option><option value="12">12 connections</option><option value="13">13 connections</option><option value="14">14 connections</option><option value="15">15 connections</option><option value="16">16 connections</option></select></label><label class="field">Output format<select id="container"><option value="">Use saved preference</option><option value="mp4">MP4 video</option><option value="mkv">MKV video</option><option value="webm">WebM video</option><option value="mp3">MP3 audio</option><option value="m4a">M4A audio</option></select></label><label class="field">Maximum resolution<select id="height"><option value="">Use saved preference</option><option value="0">Best available</option><option value="360">360p</option><option value="480">480p</option><option value="720">720p</option><option value="1080">1080p</option><option value="1440">1440p</option><option value="2160">2160p</option><option value="4320">4320p</option></select></label></div>
<p class="dialog-hint">Output format and resolution apply to media downloads. File name and checksum are available for a single URL.</p>
<div class="field"><label for="save-dir">Save folder</label><div class="input-action"><input id="save-dir" type="text" placeholder="Default download folder"><button id="choose-dir" class="button">Choose</button></div></div><div class="field"><label for="file-name">File name</label><input id="file-name" type="text" placeholder="Detected after checking the link"></div><dl id="metadata" class="metadata-summary" hidden><dt>Size</dt><dd id="meta-size">—</dd><dt>Type</dt><dd id="meta-type">—</dd><dt>Resume support</dt><dd id="meta-resume">—</dd></dl><div id="batch-results" class="batch-results" hidden role="status"></div><details class="advanced"><summary>Advanced options</summary><div class="advanced-grid"><div class="field"><label for="checksum">SHA-256 checksum</label><input id="checksum" type="text" placeholder="Optional"></div><div class="field"><label for="bandwidth">Speed limit (KB/s)</label><input id="bandwidth" type="number" min="0" placeholder="Unlimited"></div><div class="field"><label for="schedule">Scheduled time</label><input id="schedule" type="datetime-local"></div></div></details><div class="field"><label><input id="enqueue-only" type="checkbox"> Add to queue only (start manually)</label></div></section><footer class="dialog-actions"><button id="cancel" class="button quiet">Cancel</button><button id="inspect" class="button">Check link</button><button id="download" class="button primary" disabled>Start download</button></footer></main><script type="module" src="add-download.js"></script></body></html>
